{% extends "base.html" %}

{% block content %}

<!-- FULL WIDTH HERO -->
<div class="relative left-1/2 right-1/2 w-screen -ml-[50vw] -mr-[50vw]">

<section class="relative min-h-screen flex items-center justify-center overflow-hidden">

    <!-- BACKGROUND IMAGE -->
    <div class="absolute inset-0 -z-10">
        <img
            src="{{ url_for('static', filename='images/train-bg.png') }}"
            class="w-full h-full object-cover"
        >
    </div>

    <!-- DARK OVERLAY -->
    <div class="absolute inset-0 bg-black/50 -z-10"></div>

    <!-- CONTENT -->
    <div class="relative max-w-6xl w-full px-6 grid md:grid-cols-2 gap-12 items-center">

        <!-- LEFT TEXT -->
        <div class="space-y-6 text-white">

            <h1 class="text-4xl md:text-5xl font-bold leading-tight">
                Book Train Tickets <br>
                <span class="text-blue-300">Quick & Easy</span>
            </h1>

            <p class="text-lg text-gray-200">
                Search trains, choose your seat, and book tickets in seconds.
                Simple, fast and reliable railway reservation system.
            </p>

        </div>

        <!-- SEARCH CARD -->
        <div class="bg-white shadow-2xl rounded-xl p-8 w-full max-w-md md:ml-auto">

            <h2 class="text-2xl font-semibold text-gray-800 mb-6">
                Search Trains
            </h2>

            <form action="{{ url_for('search') }}" method="POST" class="space-y-5">

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">
                        From Station
                    </label>

                    <input
                        type="text"
                        name="from"
                        placeholder="Enter departure station"
                        required
                        class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">
                        To Station
                    </label>

                    <input
                        type="text"
                        name="to"
                        placeholder="Enter destination station"
                        required
                        class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">
                        Travel Date
                    </label>

                    <input
                        type="date"
                        name="date"
                        required
                        class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition"
                >
                    Search Trains
                </button>

            </form>

        </div>

    </div>

</section>

</div>

{% endblock %}
